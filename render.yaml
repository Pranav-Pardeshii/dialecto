databases:
  - name: dialecto-db
    databaseName: dialecto
    user: dialecto_user
    plan: free
    region: oregon

services:
  - type: web
    name: dialecto-backend
    runtime: python
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: "curl -LsSf https://astral.sh/uv/install.sh | sh && export UV_PYTHON_DOWNLOADS=auto && $HOME/.local/bin/uv python install 3.12 && $HOME/.local/bin/uv sync --no-dev --python 3.12"
    startCommand: "bash scripts/start.sh"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: UV_PYTHON_DOWNLOADS
        value: "auto"
      - key: DATABASE_URL
        fromDatabase:
          name: dialecto-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PRIMARY_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_FALLBACK_MODELS
        value: qwen/qwen3.8-27b,openai/gpt-oss-20b
      - key: CORS_ORIGINS
        value: "*"
      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: INFO

